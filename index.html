<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whtfck</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #666666;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --fg: #f2f2f2;
          --muted: #999999;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 1rem;
      }
      .links {
        display: flex;
        gap: 1.25rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .links a {
        color: var(--fg);
        text-decoration: none;
        border-bottom: 1px solid var(--muted);
        padding-bottom: 2px;
        font-size: 0.95rem;
      }
      .links a:hover {
        border-color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>whtfck</h1>
      <p>разработчик</p>
      <div class="links">
        <a href="https://github.com/whtfckV" target="_blank" rel="noopener">GitHub</a>
        <a href="https://t.me/whtfck_v" target="_blank" rel="noopener">Telegram</a>
        <a href="mailto:whtfck_v@icloud.com">Email</a>
      </div>
    </main>
  </body>
</html>
